  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dceffa"/>
      <stop offset="52%" stop-color="#edf8e7"/>
      <stop offset="100%" stop-color="#f7fbf2"/>
